[project]
name = "beef-retrieval-service"
version = "0.1.0"
description = "Semantic and hybrid retrieval for the $BEEF roast corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0,<1",
    "openai>=1.97.0,<3",
    "pydantic>=2.11.0,<3",
    "pydantic-settings>=2.10.0,<3",
    "qdrant-client>=1.15.0,<2",
    "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "mypy>=1.17.0,<2",
    "pytest>=8.4.0,<10",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["qdrant: requires a live Qdrant instance configured with QDRANT_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
