server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers (repeated in location blocks — nginx add_header inheritance quirk)
    set $security_headers_x_frame "DENY";
    set $security_headers_x_cto "nosniff";
    set $security_headers_rp "strict-origin-when-cross-origin";
    set $security_headers_pp "geolocation=(), microphone=(), camera=()";

    # SPA routing — HTML with short cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Frame-Options $security_headers_x_frame always;
        add_header X-Content-Type-Options $security_headers_x_cto always;
        add_header Referrer-Policy $security_headers_rp always;
        add_header Permissions-Policy $security_headers_pp always;
    }

    # Static assets — 1-year immutable cache (Vite hashed filenames)
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|webp|png|jpg|jpeg|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options $security_headers_x_frame always;
        add_header X-Content-Type-Options $security_headers_x_cto always;
        add_header Referrer-Policy $security_headers_rp always;
        add_header Permissions-Policy $security_headers_pp always;
        access_log off;
    }
}
