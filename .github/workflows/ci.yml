name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    name: beef · typecheck + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beef/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:check
      - run: pnpm test

  retrieval:
    name: retrieval-service · ruff + mypy + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrieval-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: retrieval-service/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    name: beef-web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beef-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beef-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
